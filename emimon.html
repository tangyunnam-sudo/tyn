<title>EMI-Mon 英語獸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&family=Press+Start+2P&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#e6e9f2; --ink:#1d2433; --muted:#5b6479;
  --shell:#2d4380; --shell2:#1e2f5e; --bezel:#141c30;
  --paper:#fdfcf6; --frame:#3d4f7c; --line:#d3d8e4;
  --red:#d9463a; --gold:#f2c230; --ok:#2f8a5a; --bad:#c0392b; --blue:#2f6fb0;
  --pix:"Press Start 2P",ui-monospace,monospace;
  --txt:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);background-image:radial-gradient(#cdd3e3 1px,transparent 1px);background-size:14px 14px;color:var(--ink);font-family:var(--txt);margin:0}
*{box-sizing:border-box}
.wrap{max-width:620px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:8px;gap:6px}
.top{display:flex;align-items:center;gap:10px;flex:none}
.logo{font-family:var(--pix);font-size:15px;color:var(--shell);text-shadow:2px 2px 0 var(--gold);letter-spacing:1px}
.sub{font-size:12px;color:var(--muted);font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.console{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;background:linear-gradient(160deg,#3d58a0,var(--shell) 40%,var(--shell2));border-radius:18px 18px 36px 18px;padding:10px;box-shadow:0 6px 0 #16244a,inset 0 2px 0 rgba(255,255,255,.18)}
.bezel{background:var(--bezel);border-radius:10px;padding:6px;flex:none;position:relative}
.bezel canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:3px;background:#000;image-rendering:pixelated}
.led{position:absolute;left:2px;top:50%;width:3px;height:3px;border-radius:50%;background:#ff6a6a;box-shadow:0 0 5px #ff6a6a}
.panel{flex:1;min-height:92px;overflow-y:auto;background:var(--paper);border:3px solid var(--frame);border-radius:10px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px #d8dcea;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ptext{font-size:16px;line-height:1.6;font-weight:500;white-space:pre-wrap;word-break:break-word;cursor:pointer;min-height:1.6em}
.ptext .place{font-weight:900;color:var(--shell)}
.ptext .hint{color:var(--muted);font-size:13px}
.more{display:inline-block;color:var(--red);margin-left:4px;animation:blink 1s steps(2) infinite;font-size:12px}
@keyframes blink{50%{opacity:0}}
.pchoices{display:grid;grid-template-columns:1fr;gap:6px}
.pchoices.g2{grid-template-columns:1fr 1fr}
.opt{position:relative;text-align:left;background:#fff;border:2px solid var(--line);border-radius:7px;padding:8px 10px 8px 28px;font:500 15px/1.45 var(--txt);color:var(--ink);cursor:pointer;width:100%}
.opt:hover{border-color:#9aa7c6}
.opt.sel{border-color:var(--red);background:#fff6f3}
.opt.sel::before{content:"▶";position:absolute;left:9px;top:10px;color:var(--red);font-size:11px}
.opt .n{font-family:var(--pix);font-size:9px;color:var(--muted);margin-right:6px}
.opt.en{font-size:16px;font-weight:700}
.opt.right{border-color:var(--ok);background:#eef8f1}
.opt.wrong{border-color:var(--bad);background:#fdf0ee}
.opt:disabled{cursor:default}
.opt .why{display:block;font-weight:500;font-size:13px;color:#7a4a3a;margin-top:2px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qtype{font:700 12px var(--txt);color:#fff;border-radius:10px;padding:2px 9px}
.qsit{font-size:17px;font-weight:900;line-height:1.5}
.qwritten{font-size:16px;font-weight:700;background:#eef0f5;border-left:4px solid #9aa3b8;padding:4px 10px;border-radius:4px}
.think{font-size:14px;color:var(--muted)}
.go{align-self:flex-start;font:700 14px var(--txt);background:var(--shell);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
.fb{border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:#eef8f1;border:2px solid var(--ok)}
.fb.bad{background:#fdf0ee;border:2px solid var(--bad)}
.fb strong{font-size:15px}
.say{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.say .line{font-weight:700;font-size:16px}
.say .lbl{font-size:11px;color:#7a6a2a;border:1px solid #d8c88a;border-radius:6px;padding:0 5px}
.spk{font:700 12px var(--txt);background:#fff;border:1.5px solid #9aa7c6;border-radius:8px;padding:1px 7px;cursor:pointer;color:var(--ink)}
.note{background:#fff8e1;border-left:4px solid var(--gold);padding:6px 10px;border-radius:4px;font-size:13.5px}
/* pad */
.pad{flex:none;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;user-select:none;-webkit-user-select:none;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px)}
.dpad button{background:#101a33;border:0;color:#8ea0cc;font-size:12px;cursor:pointer}
.dpad .u{grid-area:1/2;border-radius:6px 6px 0 0}.dpad .l{grid-area:2/1;border-radius:6px 0 0 6px}.dpad .c{grid-area:2/2;background:#101a33}.dpad .r{grid-area:2/3;border-radius:0 6px 6px 0}.dpad .d{grid-area:3/2;border-radius:0 0 6px 6px}
.mid{display:flex;justify-content:center;gap:10px}
.pbtn{font-family:var(--pix);font-size:8px;letter-spacing:1px;color:#d7def5;background:#1a2a55;border:0;border-radius:10px;padding:7px 12px;cursor:pointer}
.ab{display:flex;gap:12px;transform:rotate(-18deg)}
.ab button{width:50px;height:50px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#f8d060,#d89a10);color:#3a2600;font-family:var(--pix);font-size:13px;box-shadow:0 4px 0 #8a6000;cursor:pointer}
.ab button.b{background:radial-gradient(circle at 35% 30%,#f07a8a,#c83a4a);color:#fff;box-shadow:0 4px 0 #8a2030}
.ab button:active,.dpad button:active,.pbtn:active{transform:translateY(2px)}
.keys{font-size:12px;color:var(--muted);text-align:center;flex:none;margin:0}
.keys kbd{font-family:var(--pix);font-size:8px;background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 4px}
@media (hover:none){.keys{display:none}}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--gold);color:var(--ink);font:700 13px var(--txt);padding:5px 12px;border-radius:12px;z-index:30}
/* modal */
.modal{position:fixed;inset:10px;max-width:760px;margin:0 auto;background:#f3f5fa;border-radius:20px 20px 40px 20px;z-index:20;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--shell);color:#fff}
.mhead h2{margin:0;font-family:var(--pix);font-size:12px;letter-spacing:1px;line-height:1.6}
.mbtn{font:700 14px var(--txt);background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.mbtn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.mbody{flex:1;overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5}
.mnote{font-size:13px;color:var(--muted);background:#fff;border:1px dashed #c3cadc;border-radius:8px;padding:8px 10px;line-height:1.6}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:700 13px var(--txt);background:#fff;border:2px solid var(--line);border-radius:16px;padding:4px 12px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--shell);border-color:var(--shell);color:#fff}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dexc{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 8px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.dexc:disabled{cursor:default;opacity:.75}
.dexc canvas{width:48px;height:48px;image-rendering:pixelated;background:#eef1f7;border-radius:6px}
.dexc b{display:block;font-size:13.5px;line-height:1.3}
.dexc small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.tchip{display:inline-block;font:700 10.5px var(--txt);color:#fff;border-radius:8px;padding:0 6px}
.card{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card .big{width:128px;height:128px;image-rendering:pixelated;align-self:center;background:#eef1f7;border-radius:12px}
.phr{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.phr .z{font-size:13px;color:var(--muted)}
.phr .v{font-size:13.5px;color:#34405e}
.prow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 10px}
.prow.lead{border-color:var(--shell);box-shadow:0 0 0 2px rgba(45,67,128,.25)}
.prow canvas{width:48px;height:48px;image-rendering:pixelated}
.prow .pn{font-weight:700;font-size:14.5px;line-height:1.35}
.prow .pm{font-size:12px;color:var(--muted)}
.hpb{height:6px;background:#e4e8f0;border-radius:3px;overflow:hidden;margin-top:3px}.hpb i{display:block;height:100%}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.badge.got{border-color:var(--gold);background:#fffaf0}
.badge .ic{font-size:18px}
.badge:not(.got) .ic{filter:grayscale(1);opacity:.35}
.toggle{display:flex;gap:10px;align-items:center;font-size:14px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 10px}
.toggle input{width:18px;height:18px;accent-color:var(--shell)}
</style>

<div class="wrap">
  <div class="top"><div class="logo">EMI-Mon</div><div class="sub">英語獸 · 由打鐘講到放工 · Teacher Talk Trainer phrase bank</div></div>
  <div class="console">
    <div class="bezel"><span class="led"></span><canvas id="screen" width="1152" height="648" aria-label="遊戲畫面"></canvas></div>
    <div class="panel" id="panel" aria-live="polite">
      <div class="ptext" id="ptext">載入緊……</div>
      <div class="pchoices" id="pchoices"></div>
      <div id="qarea" hidden></div>
    </div>
    <div class="pad">
      <div class="dpad"><button class="u" data-k="up" aria-label="上">▲</button><button class="l" data-k="left" aria-label="左">◀</button><span class="c"></span><button class="r" data-k="right" aria-label="右">▶</button><button class="d" data-k="down" aria-label="下">▼</button></div>
      <div class="mid"><button class="pbtn" data-k="start" type="button">START</button></div>
      <div class="ab"><button class="b" data-k="b" aria-label="B" type="button">B</button><button data-k="a" aria-label="A" type="button">A</button></div>
    </div>
  </div>
  <p class="keys"><kbd>←↑↓→</kbd> 行 · <kbd>Z</kbd>/<kbd>Enter</kbd> A · <kbd>X</kbd> B（揸住跑） · <kbd>M</kbd> START 選單 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 揀答案</p>
</div>
<div class="modal" id="modal" hidden>
  <div class="mhead"><h2 id="mtitle"></h2><button class="mbtn ghost" id="mclose" type="button">關閉 ✕</button></div>
  <div class="mbody" id="mbody"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const BANK={"P":[{"m":"glue","c":"Opening 開場","zh":"打鐘，想收拾秩序開始","en":"Right — let's make a start.","a":["OK everyone, let's get going.｜更隨和","Let's begin, please.｜更正式","In your seats, please. We're starting.｜更直接"]},{"m":"glue","c":"Opening 開場","zh":"班房仲嘈，但你想開始","en":"Settle down, please. We've got a lot to get through today.","a":["Let's settle, everyone.｜更短","Quieten down for me, please.｜更溫和"]},{"m":"glue","c":"Opening 開場","zh":"想學生回憶返上堂","en":"What did we do last lesson?","a":["Where did we get to last time?","Remind me — what were we looking at?","Cast your mind back to last lesson…｜好英式，但一堂用一次就夠"],"n":"最短嗰句用得最多。'Cast your mind back' 係真嘅 teacher idiom，但如果唔係你平時嘅語氣，講出嚟會似演戲。"},{"m":"glue","c":"Opening 開場","zh":"快速重溫先","en":"Quick recap before we go on.","a":["Let's just refresh first.","Two minutes of revision, then we move on."]},{"m":"glue","c":"Opening 開場","zh":"講今日學習目標","en":"By the end of today, you should be able to do this on your own.","a":["Here's what I want you walking out with.｜更有力","Today's aim is simple: …｜更直接"],"n":"'be able to + 動詞' 係國際通用嘅 learning objective 句式。"},{"m":"glue","c":"Opening 開場","zh":"用一條問題貫穿成堂","en":"Today's all about one question.","a":["Everything today comes back to one thing.","I want you thinking about this all lesson: …"],"n":"呢個 move 好有力 —— 即刻捉到注意力，而且畀咗成堂一個骨架。"},{"m":"glue","c":"Opening 開場","zh":"叫佢哋停低手上嘢","en":"Pens down for a moment — just listen.","a":["Nothing in your hands. Just listen to this bit.","Stop writing. This part you need to hear, not copy.｜更有理由"]},{"m":"glue","c":"Opening 開場","zh":"開始前收集問題","en":"Before we start — anything left over from last time?","a":["Any questions from the homework before we move on?","Anything still bothering you from Tuesday?｜更溫和"]},{"m":"glue","c":"Transition 過渡","zh":"由理論轉去實例","en":"That's the theory. Now let's see it in action.","a":["So much for the theory. Does it actually work?｜更挑釁","Right — theory done. Let's test it."]},{"m":"glue","c":"Transition 過渡","zh":"有人問咗離題但好嘅問題","en":"Let's park that for now and come back to it at the end.","a":["Good question — I'll come back to it, I promise.｜更溫和","Hold that one. It fits better later."],"n":"'park it' 好常用。加一句 'I promise' 令學生真係相信你會返嚟 —— 而你要真係返嚟。"},{"m":"glue","c":"Transition 過渡","zh":"學生太早問到後面內容","en":"Hold that thought — it'll make more sense in five minutes.","a":["You're one step ahead of me. Give me two minutes.｜讚埋佢","Keep that in your head. We're getting there."]},{"m":"glue","c":"Transition 過渡","zh":"講完一半，準備講另一半","en":"So that's the first half of the story. Here's the other half.","a":["That's one side of it. Now the other side.","Half done. Stay with me."]},{"m":"glue","c":"Transition 過渡","zh":"連返之前教過嘅嘢","en":"This links straight back to what we did last week.","a":["You've seen this before, in a different disguise.｜更有趣","Sound familiar? It should."]},{"m":"glue","c":"Transition 過渡","zh":"簡單過場","en":"Right — moving on.","a":["OK. Next.｜最短","Let's crack on.｜英式，同事之間用得多過對學生"]},{"m":"glue","c":"Transition 過渡","zh":"轉去完全另一個 mode","en":"Let's shift gear.","a":["Change of pace now.","Right, something completely different."]},{"m":"glue","c":"Transition 過渡","zh":"順勢帶到下一點","en":"That brings us to the next point.","a":["Which is exactly where I wanted to go next.","And that leads straight into…"]},{"m":"glue","c":"Transition 過渡","zh":"走之前仲有一樣嘢","en":"One more thing before we leave this.","a":["Last point on this, then we move.","Before I let this go —"]},{"m":"glue","c":"Instructions 指令","zh":"叫學生揭書","en":"Turn to page 47 — top of the page.","a":["Page 47, please. Halfway down.","Open your books at 47."]},{"m":"glue","c":"Instructions 指令","zh":"兩人一組討論","en":"In pairs, take two minutes.","a":["Turn to the person next to you and talk it through.","With your partner — two minutes, go."]},{"m":"glue","c":"Instructions 指令","zh":"叫佢哋唔好即刻寫，先諗","en":"Don't write anything yet — just think about it.","a":["No pens. Just thinking for now.","Think first, write second."]},{"m":"glue","c":"Instructions 指令","zh":"抄低之後再解釋","en":"Copy this down, then we'll talk it through.","a":["Get this down first — the explanation follows.","Copy it now, understand it in a minute."],"n":"'talk it through' = 逐點傾清楚，比 'explain' 更有同行感。"},{"m":"glue","c":"Instructions 指令","zh":"放佢哋開始做嘢","en":"You've got three minutes. Off you go.","a":["Three minutes. Starting now.","Right — go."]},{"m":"glue","c":"Instructions 指令","zh":"同隔籬位對答案","en":"Compare answers with the person next to you.","a":["Check yours against your neighbour's.","See if you two agree."]},{"m":"glue","c":"Instructions 指令","zh":"先自己做頭兩題","en":"Work through the first two on your own.","a":["First two by yourself, no talking.","Try the first pair solo."]},{"m":"glue","c":"Instructions 指令","zh":"做完舉手","en":"Put your hand up when you've finished.","a":["Hand up when you're done.","Let me know when you've got something."]},{"m":"glue","c":"Instructions 指令","zh":"卡住咗就跳過","en":"If you're stuck, skip it and come back to it.","a":["Don't sit on one question. Move on and return.","Leave it, keep going, come back at the end."]},{"m":"glue","c":"Timing 時間","zh":"仲有半分鐘","en":"About thirty seconds left.","a":["Thirty seconds.","Start wrapping up."]},{"m":"glue","c":"Timing 時間","zh":"時間到，收返上嚟","en":"Time's up — let's hear what you've got.","a":["That's time. What did you come up with?","Pens down. Let's share."]},{"m":"glue","c":"Timing 時間","zh":"堂快完，要加快","en":"We're running short on time, so let's pick up the pace.","a":["We're tight for time — I'll move quickly.","I'm going to speed up. Stop me if I lose you.｜更負責任"]},{"m":"glue","c":"Timing 時間","zh":"畀多一分鐘","en":"I'll give you one more minute.","a":["Another minute — you're nearly there.","Sixty more seconds."]},{"m":"glue","c":"Timing 時間","zh":"今日講唔完，要停","en":"We'll have to leave it there for today.","a":["That's where we'll stop.","We'll pick this up next time."]},{"m":"glue","c":"Checking 檢查理解","zh":"問佢哋明唔明（唔好講 Understand?）","en":"Does that make sense?","a":["Is everyone with me?","Is that clear, or should I go over it again?","Should I explain it a different way?｜最溫和"],"n":"'Understand?' 聽落似盤問。以上每一句都畀咗學生一個安全嘅出口去講「唔明」。全部都用最簡單嘅字 —— 檢查理解嘅句子本身唔可以成為理解障礙。"},{"m":"glue","c":"Checking 檢查理解","zh":"快速全班檢查","en":"Thumbs up if you're with me, thumbs down if you're lost.","a":["Show me — one to five, how confident are you?","Hands up if that landed."]},{"m":"glue","c":"Checking 檢查理解","zh":"要學生用自己嘅話講一次","en":"Who can put that in their own words for me?","a":["Explain it back to me — but don't use my words.｜更嚴格","How would you say that to someone in Form 3?｜更有趣"],"n":"呢句應該成為你嘅口頭禪 —— 佢直接分辨到「真明」定「背咗」。"},{"m":"glue","c":"Checking 檢查理解","zh":"想學生講出推理過程","en":"Talk me through it.","a":["Walk me through your thinking.","How did you get there?"]},{"m":"glue","c":"Checking 檢查理解","zh":"問自己講得太快","en":"Am I going too fast?","a":["Do you need me to slow down?","Is this pace alright?"]},{"m":"glue","c":"Checking 檢查理解","zh":"邀請佢哋隨時打斷","en":"Stop me if I lose you.","a":["Interrupt me the moment it stops making sense.","Shout if I go too fast."]},{"m":"glue","c":"Closing 收堂","zh":"總結成堂","en":"Let's pull it together. Three things to take away.","a":["So — what have we actually learnt today?｜反問式","Right, summary. Three points."]},{"m":"glue","c":"Closing 收堂","zh":"強調最重要一點","en":"If you remember nothing else from today, remember this.","a":["One thing to walk out with: …","Forget the rest if you must — but keep this."]},{"m":"glue","c":"Closing 收堂","zh":"派功課","en":"For homework, have a go at question 4.","a":["Homework is question 4 — same idea, new context.","Try question 4 tonight. It should feel familiar."],"n":"'have a go at' = 試吓做，語氣輕鬆但一樣清楚。"},{"m":"glue","c":"Closing 收堂","zh":"預告下堂","en":"Next lesson we'll pick this up and push it further.","a":["Next time we take this apart properly.","More on this Thursday."]},{"m":"glue","c":"Closing 收堂","zh":"收堂前肯定佢哋","en":"That's it for today. Well done — you worked hard.","a":["Good lesson. Thank you.","You gave me a lot today. See you Thursday."]},{"m":"glue","c":"Behaviour 秩序","zh":"班房嘈","en":"Let's have a bit of quiet, please.","a":["Quieten down, please.","Noise level, everyone.｜更短更輕"]},{"m":"glue","c":"Behaviour 秩序","zh":"唔想嗌，想用沉默施壓","en":"I'll wait.","a":["I'm happy to wait.","（唔講嘢，企定定望住。）｜最強"],"n":"兩個字，可能係全個 bank 最有效嘅一句。講完閉嘴，唔好再出聲 —— 一出聲就冇晒力。"},{"m":"glue","c":"Behaviour 秩序","zh":"幾個人同時講","en":"One voice at a time.","a":["One at a time, please.","Let him finish."]},{"m":"glue","c":"Behaviour 秩序","zh":"最後警告","en":"That's the last warning — then I'll move you.","a":["I've asked twice. There won't be a third time.","Next time you're moving seats."]},{"m":"glue","c":"Behaviour 秩序","zh":"要佢哋轉返身望前面","en":"I need you facing this way.","a":["Turn round, please.","Eyes this way."]},{"m":"glue","c":"Behaviour 秩序","zh":"要全班注意力","en":"Can I have your attention up here, please?","a":["Eyes on me.","Everyone looking this way, please."]},{"m":"glue","c":"Behaviour 秩序","zh":"收電話","en":"Phones away, please.","a":["Phone in your bag, not your pocket.｜更明確","I shouldn't be able to see a phone."]},{"m":"think","c":"Buying time 爭取時間","zh":"畀人問到，需要一兩秒諗","en":"Good question. Let me think how to explain it.","a":["Give me a moment to get the wording right.","Hmm. Let me think about that one."],"n":"呢句係「合法嘅停頓」。你唔係卡住，你係喺度揀最準嘅講法 —— 完全唔同觀感。"},{"m":"think","c":"Buying time 爭取時間","zh":"要小心措辭","en":"Let me phrase that carefully.","a":["I want to get the wording right here.","Let me be careful how I say this."]},{"m":"think","c":"Buying time 爭取時間","zh":"諗緊點講好（可以講出口）","en":"How do I want to say this…","a":["What's the clearest way to put this…","Right, how do I explain this properly…"]},{"m":"think","c":"Buying time 爭取時間","zh":"需要幾秒","en":"Give me a second.","a":["Bear with me one moment.","Hang on."]},{"m":"think","c":"Buying time 爭取時間","zh":"完全唔知講咩好","en":"（唔講嘢。停兩秒。）","a":["（望住個 whiteboard，慢慢寫個關鍵字。）｜爭取五秒","（飲一啖水。）｜爭取三秒，冇人會察覺"],"n":"最重要嘅一「句」係冇句。兩秒靜默喺學生耳中 = 你喺度諗；兩秒 'er…' = 你唔識。同樣時間，相反效果。"},{"m":"think","c":"Hedging 留有餘地","zh":"大方向係咁，但有例外","en":"Broadly speaking, that's right.","a":["In general terms, yes.","By and large, that holds."]},{"m":"think","c":"Hedging 留有餘地","zh":"一般規律","en":"As a rule of thumb…","a":["As a general rule…","Nine times out of ten…"]},{"m":"think","c":"Hedging 留有餘地","zh":"多數情況下","en":"More often than not…","a":["In most cases…","Usually, though not always…"]},{"m":"think","c":"Hedging 留有餘地","zh":"啱到某個程度","en":"That's true up to a point.","a":["Yes — but only so far.","There's something in that, but not the whole story."]},{"m":"think","c":"Hedging 留有餘地","zh":"承認自己簡化咗","en":"I'm simplifying here, and I'll come clean about that.","a":["This is the simplified version. The real thing has more moving parts.","I'm cutting corners here deliberately — I'll fill them in later."],"n":"誠實承認簡化，反而令你聽落更權威 —— 因為你知道埋複雜嗰面。"},{"m":"think","c":"Hedging 留有餘地","zh":"實情複雜啲，但暫時咁講","en":"It's more complicated than that, but for now let's keep it simple.","a":["The full picture is messier. We'll get there.","There's more to it, but this'll do for today."]},{"m":"think","c":"Signposting 講出結構","zh":"預告有幾點","en":"There are three things going on here. Let me take them one at a time.","a":["Two parts to this. First…","I want to split this into three."],"n":"講出結構 = 你唔使即場諗點組織，個框架已經幫你頂住咗。呢招對流暢度嘅幫助大過任何生字。"},{"m":"think","c":"Signposting 講出結構","zh":"叫佢哋忍一忍","en":"Bear with me — this'll make sense in a moment.","a":["Stay with me. It comes together shortly.","Trust me for thirty seconds."]},{"m":"think","c":"Signposting 講出結構","zh":"呢點遲啲會返嚟","en":"I'm going to come back to this, so just note it for now.","a":["Park this one. We need it later.","Write it down — you'll want it in ten minutes."]},{"m":"think","c":"Signposting 講出結構","zh":"要精準講定義","en":"Let me be precise about the wording here.","a":["The exact words matter here.","I'm going to be fussy about this sentence."]},{"m":"think","c":"Signposting 講出結構","zh":"由頭再嚟過","en":"Let me start again from the top.","a":["Right — from the beginning.","Let's rebuild this from scratch."]},{"m":"think","c":"Self-repair 自我修正","zh":"講錯咗，想倒返轉","en":"Sorry — let me rewind.","a":["Let me back up a step.","Rewind. I went too fast there."]},{"m":"think","c":"Self-repair 自我修正","zh":"上一句唔好，換過","en":"Scrap that. Here's a better way to put it.","a":["Forget that sentence. Try this one.","Bad explanation. Let me do it properly."]},{"m":"think","c":"Self-repair 自我修正","zh":"補充講清楚","en":"What I mean is…","a":["To put it another way…","In other words…"]},{"m":"think","c":"Self-repair 自我修正","zh":"即時修正措辭","en":"Or rather…","a":["— or more accurately…","— well, more precisely…"],"n":"兩個字，令一次口誤變成一次精準化。極好用，而且極短。"},{"m":"think","c":"Self-repair 自我修正","zh":"發現自己講錯事實","en":"Actually, ignore what I just said — that's not right.","a":["Cross that out. I got it wrong.","Hold on — that's wrong. Let me correct it."]},{"m":"think","c":"Self-repair 自我修正","zh":"自己搞亂咗自己","en":"Sorry, I've confused myself. Let me take that again.","a":["I've tied myself in knots. Starting over.｜幽默","Right, I've lost my own thread. From the top."]},{"m":"expl","c":"Defining 落定義","zh":"要畀精準嘅正式定義","en":"Formally, it's defined as follows.","a":["The technical definition is this.","Here's the exact wording you need."]},{"m":"expl","c":"Defining 落定義","zh":"學生講法差少少","en":"Strictly speaking, that's not quite right. The precise wording is…","a":["Close — but the exam wants these exact words.","Almost. Tighten it up like this."]},{"m":"expl","c":"Defining 落定義","zh":"日常意思同學術意思唔同","en":"In everyday English we'd say that, but here it means something much narrower.","a":["Careful — this word means something specific in here.","Ordinary meaning and technical meaning part company at this point."]},{"m":"expl","c":"Defining 落定義","zh":"強調定義入面嘅關鍵字","en":"The key words are 'willing' and 'able' — both have to be true.","a":["Notice the 'and'. It's doing a lot of work.｜更引導","Circle those two words. Drop either and it's wrong."],"n":"重讀 'and'。定義入面嘅連接詞往往就係得分位。"},{"m":"expl","c":"Defining 落定義","zh":"提醒唔好撈亂","en":"Don't confuse the everyday meaning with the technical one.","a":["Same word, two jobs. Keep them apart.","This is a false friend. Be careful."]},{"m":"expl","c":"Defining 落定義","zh":"介紹一個專有名詞","en":"There's a word for this, and it's worth knowing.","a":["This has a name. Here it is.","Economists call this…｜替換你科名"]},{"m":"expl","c":"Concrete 具體化","zh":"由抽象轉去具體","en":"Let me make that concrete.","a":["That's abstract. Let's ground it.","Enough theory — here's a real one."]},{"m":"expl","c":"Concrete 具體化","zh":"舉真實例子","en":"Take a real case.","a":["Here's one that actually happened.","A real example, not a made-up one."]},{"m":"expl","c":"Concrete 具體化","zh":"用故事開頭","en":"Picture this. It's 1929, and nobody has seen this coming.","a":["Let me tell you what happened in 1929.","Set the scene: it's 1929."],"n":"用現在式講歷史（historic present）—— 講故仔即刻生動咗，係好強嘅 teacher move。"},{"m":"expl","c":"Concrete 具體化","zh":"介紹反例","en":"Here's a case that breaks the rule — and that's exactly what makes it interesting.","a":["Now here's an awkward one for the theory.","This example refuses to behave. Why?｜更引導"]},{"m":"expl","c":"Concrete 具體化","zh":"承認現實比課本亂","en":"That's the textbook version. In practice it's a lot messier.","a":["Real life doesn't read the textbook.","The tidy version is what you write in the exam. The messy version is what actually happens."]},{"m":"expl","c":"Concrete 具體化","zh":"叫學生自己舉例","en":"Give me an example from your own life.","a":["Where have you seen this happen?","Find me one from this week."]},{"m":"expl","c":"Analogy 比喻","zh":"打個比喻","en":"Think of it like a tap — you can turn it up or down, but the pipe stays the same.","a":["It works a bit like a thermostat.","Here's an analogy that might help."]},{"m":"expl","c":"Analogy 比喻","zh":"相似但有一個關鍵分別","en":"It's a bit like that, but with one important difference.","a":["Same idea, one crucial twist.","Nearly the same — except for one thing."]},{"m":"expl","c":"Analogy 比喻","zh":"提醒個比喻唔可以推太遠","en":"The analogy breaks down here, so don't push it too far.","a":["Every analogy has a limit. This one ends here.","Stop the comparison at this point — beyond it, it misleads."],"n":"呢句係高手 move。承認比喻嘅極限，教學生比喻係工具唔係真理。"},{"m":"expl","c":"Distinguishing 分辨","zh":"提醒呢度最多人錯","en":"This is where people usually go wrong.","a":["This is the classic trap.","Most people get this bit wrong."]},{"m":"expl","c":"Distinguishing 分辨","zh":"同一個字兩個意思","en":"Same word, different meaning. Watch out for that.","a":["The word is doing two jobs. Don't mix them.","One word, two definitions. Context decides."]},{"m":"expl","c":"Distinguishing 分辨","zh":"想並排比較","en":"Let's put them side by side.","a":["Two columns. Left and right.","Let's compare them directly."]},{"m":"expl","c":"Distinguishing 分辨","zh":"點出關鍵分別","en":"What separates the two is the direction.","a":["The difference comes down to one thing.","Everything hinges on this distinction."]},{"m":"expl","c":"Distinguishing 分辨","zh":"表面似但本質唔同","en":"They look similar on the surface, but they behave completely differently.","a":["Same shape, opposite behaviour.","Superficially alike, fundamentally different."]},{"m":"expl","c":"Cause & effect 因果","zh":"講三步因果","en":"A leads to B, which in turn causes C.","a":["A causes B, and B then triggers C.","Follow it through: A, then B, then C."],"n":"'which in turn' 係因果鏈嘅萬用接駁位。背熟佢 —— 你講因果幾乎每次都會用到。"},{"m":"expl","c":"Cause & effect 因果","zh":"影響傳導到另一邊","en":"That feeds through to everything else.","a":["The effect spreads outward from there.","It ripples through the whole system."]},{"m":"expl","c":"Cause & effect 因果","zh":"講連鎖後果","en":"The knock-on effect is significant.","a":["There's a second-round effect too.","And then there's the consequence of the consequence."]},{"m":"expl","c":"Cause & effect 因果","zh":"其他條件不變","en":"Holding everything else constant…","a":["All else equal…","Assuming nothing else changes…"]},{"m":"expl","c":"Cause & effect 因果","zh":"帶學生逐步推","en":"Trace the chain with me. Step one… step two…","a":["Let's walk it through together.","One link at a time."]},{"m":"expl","c":"Cause & effect 因果","zh":"講因果方向","en":"The causation runs from A to B, not the other way round.","a":["Which one is doing the causing? That's the question.｜更引導","Direction matters here."]},{"m":"expl","c":"Cause & effect 因果","zh":"提醒相關唔等於因果","en":"That's correlation. Is it causation? Not necessarily.","a":["They move together — but does one cause the other?","Two things happening at once is not the same as one causing the other."]},{"m":"expl","c":"Cause & effect 因果","zh":"兩股力量相反，結果唔定","en":"Two forces pulling in opposite directions — the net effect depends on which one dominates.","a":["It cuts both ways. Which effect wins?","Two opposing pressures. The outcome is an empirical question."],"n":"呢句係高分答案嘅標準結尾。答 'it depends' 冇分，答呢句有分。"},{"m":"expl","c":"Rephrasing 換講法","zh":"學生聽唔明，換個講法","en":"Let me put that another way.","a":["Different words, same idea:","Try this version instead."]},{"m":"expl","c":"Rephrasing 換講法","zh":"換個角度切入","en":"Let's try it from a different angle.","a":["Come at it from the other side.","New approach — forget how I just said it."]},{"m":"expl","c":"Rephrasing 換講法","zh":"叫佢唔好卡喺字面","en":"Forget the wording for a second — what's actually happening?","a":["Never mind the vocabulary. What's the idea?","Drop the jargon. Say it in plain English."]},{"m":"expl","c":"Rephrasing 換講法","zh":"剝到最簡單","en":"Let's make this as simple as possible.","a":["At its simplest, it's this.","Let's strip it right back.｜英式口語"]},{"m":"expl","c":"Rephrasing 換講法","zh":"承認自己講得唔好","en":"I don't think I explained that well. Let me try again.","a":["That was my fault, not yours. Once more.","Judging by your faces, I explained that badly.｜輕鬆啲"],"n":"把責任放喺自己身上，唔係學生。呢個 move 令成班鬆晒，願意再試。"},{"m":"expl","c":"Emphasis 強調","zh":"值得抄低","en":"This one's worth writing down.","a":["Get this down.","If you're taking notes, take this one."]},{"m":"expl","c":"Emphasis 強調","zh":"今日最重要一點","en":"If you take one thing from today, take this.","a":["This is the headline.","Everything else today is detail. This is the point."]},{"m":"expl","c":"Emphasis 強調","zh":"重複一次","en":"I'll say that again, because it matters.","a":["Once more, slowly.","Let me repeat that — it's important."]},{"m":"expl","c":"Emphasis 強調","zh":"年年都考","en":"This comes up every single year.","a":["You will see this in the exam.","Examiners love this one."]},{"m":"qna","c":"Eliciting 引導","zh":"想知學生點諗","en":"What do you think?","a":["What's your first thought?","Thoughts?｜最短","What do you reckon?｜英式口語，隨和啲"],"n":"對住學生用最簡單嗰個。學生都係 L2 —— 你用 idiom，佢哋要喺腦入面譯多一次先明，思考嘅力就用喺你句嘢度，唔係用喺個概念度。"},{"m":"qna","c":"Eliciting 引導","zh":"唔要答案，要方法","en":"Don't tell me the answer — tell me how you'd start.","a":["Where would you begin?","What's your first move?"]},{"m":"qna","c":"Eliciting 引導","zh":"鼓勵亂估","en":"Give me a rough guess. You can't get it wrong at this stage.","a":["Just try. Anything will do.","Wrong answers are fine right now."]},{"m":"qna","c":"Eliciting 引導","zh":"全班投票","en":"Hands up if you think yes. Hands up if you think no.","a":["Quick vote. A or B?","Show me with your hands."]},{"m":"qna","c":"Eliciting 引導","zh":"想叫未講過嘢嘅學生","en":"Someone who hasn't spoken yet.","a":["Let's hear a new voice.","Someone from this side of the room."]},{"m":"qna","c":"Eliciting 引導","zh":"畀思考時間先答","en":"I'm going to give you ten seconds to think before anyone answers.","a":["No hands for ten seconds. Just think.","Everyone thinks first. Then we talk."],"n":"Wait time。研究上單一最有效嘅提問改善，而且完全唔使英文好。多數老師只等一秒。"},{"m":"qna","c":"Eliciting 引導","zh":"預告會點名（公平地）","en":"No hands this time — I'll pick.","a":["I'm choosing, so everyone needs an answer ready.","Cold call this round. Be ready."]},{"m":"qna","c":"Wrong answer 答錯","zh":"方向錯但概念啱","en":"You're on the right track — but check the direction.","a":["Right idea, wrong way round.","You've got the mechanism. Now flip it."]},{"m":"qna","c":"Wrong answer 答錯","zh":"答錯，但想佢講埋思路","en":"Not quite — but tell me why you thought that.","a":["That's wrong, and I want to know how you got there.｜更直接","Interesting. Walk me through your reasoning."],"n":"全個 bank 最重要嘅一句。佢將「錯」變成「資料」，學生就唔會收聲。"},{"m":"qna","c":"Wrong answer 答錯","zh":"答咗另一個概念","en":"That's the definition of the other one. Close, though.","a":["You've swapped the two. Which is which?","Right definition, wrong term."]},{"m":"qna","c":"Wrong answer 答錯","zh":"呢個係常見誤解","en":"That's what most people say first. Here's the catch.","a":["Everyone says that. And everyone's wrong — here's why.｜更戲劇性","That's the intuitive answer. It's also the trap."]},{"m":"qna","c":"Wrong answer 答錯","zh":"溫和挑戰","en":"I can see where that's coming from. Let's test it.","a":["Fair reasoning. Does it survive an example?","Let's push on that and see if it holds."]},{"m":"qna","c":"Wrong answer 答錯","zh":"差一步","en":"Nearly. You're one step away.","a":["So close. One more move.","You've done the hard bit. Finish it."]},{"m":"qna","c":"Partial 答一半","zh":"答啱一半","en":"Half of that is spot on. Push it further.","a":["Good start. Keep building.","That's the first half. Where's the second?"]},{"m":"qna","c":"Partial 答一半","zh":"有結論冇理由","en":"Good — now add the 'because'.","a":["Right answer. Now justify it.","And your reasoning?"]},{"m":"qna","c":"Partial 答一半","zh":"要佢解釋原因","en":"You've given me the what. I want the why.","a":["That's the description. Now explain it.","Why does that happen?"]},{"m":"qna","c":"Partial 答一半","zh":"想佢講多啲","en":"Say more.","a":["Go on.","Expand on that."]},{"m":"qna","c":"Partial 答一半","zh":"佢停低咗，想佢繼續","en":"Keep going — you're doing fine.","a":["Don't stop. You're onto something.","And then?"]},{"m":"qna","c":"Redirect 轉問全班","zh":"掟返畀全班","en":"Does everyone agree with that? Anyone want to challenge it?","a":["Show of hands — who agrees?","Any objections to that?"]},{"m":"qna","c":"Redirect 轉問全班","zh":"叫另一個學生接落去","en":"Someone build on that.","a":["Who can add to it?","Take it further for me."]},{"m":"qna","c":"Redirect 轉問全班","zh":"指名接力","en":"Kelvin says yes. Yan — what do you think?","a":["You've heard Kelvin. Do you buy it?","Yan, respond to that."]},{"m":"qna","c":"Redirect 轉問全班","zh":"兩個相反答案","en":"Two different answers. Let's find out which one survives.","a":["We've got a disagreement. Good.｜更鼓勵爭辯","Both can't be right. How do we decide?"]},{"m":"qna","c":"I don't know 唔識答","zh":"學生話唔識","en":"That's fine. Take a guess and I'll help you tidy it up.","a":["No problem. Guess, and we'll fix it together.","Have a go anyway — I'll catch you."]},{"m":"qna","c":"I don't know 唔識答","zh":"收窄範圍幫佢","en":"Let me narrow it down. Is it A or B? Just that.","a":["Easier question: up or down?","Forget the whole thing. Just this bit."]},{"m":"qna","c":"I don't know 唔識答","zh":"畀佢下台階，遲啲再問","en":"I'll come back to you in a minute — have a think.","a":["Hold that. I'll ask you again shortly.","Take a minute. I'll return."],"n":"保住咗個學生嘅面，同時佢知道你會返嚟，所以真係會諗。記得真係要返嚟。"},{"m":"qna","c":"Teacher stuck 你唔識","zh":"問到你唔肯定嘅嘢","en":"That's a really good question, and I don't want to give you a sloppy answer. Let me check and come back to you next lesson.","a":["I'd be guessing, and I'd rather not guess at you. Let me look it up.","Good question — one I need to check properly."],"n":"保住專業信譽，同時示範咗「唔確定就唔亂噏」—— 正正係你想學生學嘅嘢。"},{"m":"qna","c":"Teacher stuck 你唔識","zh":"有初步答案但要核實","en":"I think so, but let me check before you write it down.","a":["Off the top of my head, yes — but don't quote me yet.","Probably. I'll confirm next lesson."]},{"m":"qna","c":"Teacher stuck 你唔識","zh":"坦白唔知","en":"Honestly? I'm not sure. Let's find out together.","a":["I don't know. Shall we look?","That one's beyond me. Let's dig."]},{"m":"qna","c":"Praise 稱讚","zh":"完全答啱（唔好次次 correct）","en":"That's exactly it.","a":["Spot on.","Yes — precisely that.","That's the one."]},{"m":"qna","c":"Praise 稱讚","zh":"用字好準確","en":"Nice — that's the precise wording.","a":["Good vocabulary. That's the technical term.","You said it exactly right."]},{"m":"qna","c":"Praise 稱讚","zh":"係攞滿分嘅答法","en":"That's the kind of answer that gets full marks.","a":["Write that down — all of you.","Exam-standard answer, that."]},{"m":"qna","c":"Praise 稱讚","zh":"睇到人哋睇唔到嘅嘢","en":"You've spotted something a lot of people miss.","a":["That's a subtle point. Well seen.","Most classes never notice that."]},{"m":"qna","c":"Praise 稱讚","zh":"佢講得比你好","en":"That's a better way of saying it than mine.","a":["I'm stealing that. Better than my version.｜幽默","I'll use your wording from now on."],"n":"敢咁講嘅老師，班房會突然多好多人肯開口。"},{"m":"qna","c":"Praise 稱讚","zh":"讚佢肯質疑","en":"I like that you challenged it.","a":["Good — keep being suspicious.","That's exactly the right instinct."]},{"m":"rapp","c":"Encouragement 鼓勵","zh":"見到長期進步","en":"You've come a long way since September.","a":["Compare this to your first piece of work. Big difference.","You're not the same student you were in September."]},{"m":"rapp","c":"Encouragement 鼓勵","zh":"比上次好","en":"That's a big improvement on last time.","a":["Real progress here.","Much stronger than the last one."]},{"m":"rapp","c":"Encouragement 鼓勵","zh":"承認難，叫佢頂住","en":"I know it's hard. Stick with it.","a":["This topic defeats a lot of people. Keep going.","It's meant to be difficult. That's not a sign you're failing."]},{"m":"rapp","c":"Encouragement 鼓勵","zh":"建立安全嘅班房氣氛","en":"Don't worry about being wrong in here. That's what this room is for.","a":["Nobody gets laughed at in my classroom.","Being wrong out loud is how this works."]},{"m":"rapp","c":"Encouragement 鼓勵","zh":"佢覺得自己好差","en":"You're closer than you think.","a":["You know more than you're giving yourself credit for.","The gap is smaller than it feels."]},{"m":"rapp","c":"Individual help 個別輔導","zh":"約佢小息傾","en":"Come and see me at break and we'll go through it.","a":["Find me at lunch — we'll sort it.","Stay behind for two minutes after class."]},{"m":"rapp","c":"Individual help 個別輔導","zh":"問佢邊度唔明","en":"Which bit isn't making sense?","a":["Where exactly does it stop being clear?","Point at the line where you lost it."],"n":"比 'What don't you understand?' 好 —— 假設咗佢明咗一部分，只係有一格塞住。"},{"m":"rapp","c":"Individual help 個別輔導","zh":"叫佢指出卡住位","en":"Show me where you got stuck.","a":["Talk me through what you tried.","What was your last confident step?"]},{"m":"rapp","c":"Individual help 個別輔導","zh":"叫佢做多一次","en":"Try that one again on your own, and I'll check it in a minute.","a":["Have another go. I'll be back.","Redo it — I'll look in five minutes."]},{"m":"rapp","c":"Absence & lateness 缺席遲到","zh":"缺咗堂嘅學生","en":"You missed Tuesday — catch up with someone, and come to me if you're still stuck.","a":["Borrow someone's notes for Tuesday, then see me.","You've got a gap from Tuesday. Let's fill it."]},{"m":"rapp","c":"Absence & lateness 缺席遲到","zh":"有人遲到，唔想打斷成堂","en":"You're late. Sit down quietly — we'll talk afterwards.","a":["Sit down. See me at the end.","In you come. We'll discuss it later."],"n":"處理咗，但唔畀佢成為全班焦點 —— 遲到嘅學生最想要嘅就係注意力。"},{"m":"rapp","c":"Absence & lateness 缺席遲到","zh":"關心近排唔妥嘅學生","en":"Is everything alright? You've been quiet lately.","a":["You don't seem yourself. Anything going on?","Everything OK? You know where I am if not."]},{"m":"rapp","c":"Homework 功課","zh":"交功課限期","en":"Hand it in by Friday, please.","a":["Friday, on my desk.","Due Friday — no extensions this time."]},{"m":"rapp","c":"Homework 功課","zh":"預先講遲交規矩","en":"If you're going to be late with it, tell me beforehand, not afterwards.","a":["Talk to me before the deadline, not after.","I'm reasonable in advance and less reasonable in hindsight.｜幽默但清晰"]},{"m":"rapp","c":"Homework 功課","zh":"派返改好嘅功課","en":"I've marked these. A couple of general points before I hand them back.","a":["Before you get these back — two things I noticed across the class."]},{"m":"rapp","c":"Homework 功課","zh":"叫佢哋睇評語唔好淨係睇分","en":"Don't just look at the mark — read the comments.","a":["The mark tells you where you are. The comments tell you how to move.","Five seconds on the grade, five minutes on the feedback."]},{"m":"rapp","c":"Homework 功課","zh":"成班都做得唔好","en":"A lot of you lost marks on the same thing, so let's fix it together.","a":["Same mistake, twenty times. My fault as much as yours.｜承擔","This one error cost the class a lot of marks."]},{"m":"rapp","c":"Apologising 認錯","zh":"你自己講錯咗","en":"Good spot. I made a mistake there.","a":["You're right and I was wrong. Thank you.","Well caught. Let me correct that."],"n":"當住全班認錯，係你教「知識係可以修正」最有力嘅一次示範。"},{"m":"rapp","c":"Apologising 認錯","zh":"上堂教錯咗要更正","en":"I need to correct something I said last lesson.","a":["Amendment from Tuesday — I got one thing wrong.","Before we start: last lesson I misled you slightly."]},{"m":"rapp","c":"Apologising 認錯","zh":"答唔到學生嘅質疑","en":"That's a fair point, and I don't have a good answer to it.","a":["You've got me. I can't defend that.","Fair challenge. I'll have to think about it."]},{"m":"rapp","c":"Warmth 輕鬆氣氛","zh":"星期五下晝，全班好攰","en":"I know it's Friday afternoon. Bear with me.","a":["Last lesson of the week. Let's make it painless.","I can see the weekend in your eyes."]},{"m":"rapp","c":"Warmth 輕鬆氣氛","zh":"感覺全班快瞓著","en":"Right — before you all fall asleep on me…","a":["I'm losing you. Everyone stand up for ten seconds.｜真係有效","Energy check. Sit up."]},{"m":"rapp","c":"Warmth 輕鬆氣氛","zh":"考試前安撫","en":"You're better prepared than you feel. Trust that.","a":["Nerves are normal. They're not evidence you're unready.","You've done the work. Let it do its job."]},{"m":"rapp","c":"Warmth 輕鬆氣氛","zh":"放假前","en":"Have a good break. Rest properly — you've earned it.","a":["Enjoy the holiday. Don't think about me.｜幽默","Switch off properly. See you in September."]},{"m":"work","c":"Meetings 會議","zh":"開始個會","en":"Shall we make a start?","a":["Right, let's get going.｜更直接","I think we're all here — let's begin.｜更正式"]},{"m":"work","c":"Meetings 會議","zh":"介紹議程","en":"There are three items on the agenda today.","a":["We've got three things to cover.｜更口語","I'll keep this short — three items, then we're done.｜體貼"]},{"m":"work","c":"Meetings 會議","zh":"想插嘴發言","en":"Can I come in on that?","a":["Sorry — may I add something?｜更客氣","Just a quick point on that.｜最短"],"n":"英文會議插嘴要有「敲門聲」。直接開口講會顯得粗魯；呢三句就係敲門。"},{"m":"work","c":"Meetings 會議","zh":"以總務身份表達立場","en":"Speaking for General Affairs, the main concern is cost.","a":["From my side, the issue is manpower.","My worry is the timeline, not the budget."]},{"m":"work","c":"Meetings 會議","zh":"同意","en":"That works for me.","a":["I'm happy with that.","Agreed — no objection from me.｜更正式"]},{"m":"work","c":"Meetings 會議","zh":"部分同意","en":"I take your point, but there's a practical problem.","a":["I agree in principle — the budget just won't stretch.","Yes in theory. In practice it's harder."],"n":"'I take your point, but…' 係英文職場最有用嘅一個轉折。先承認對方，再反對，唔會傷和氣。"},{"m":"work","c":"Meetings 會議","zh":"不同意但要有禮","en":"I'm not sure that'll work, and here's why.","a":["Can I offer a different view?｜最溫和","I'd push back on that slightly.｜英式含蓄但清楚"]},{"m":"work","c":"Meetings 會議","zh":"要查資料先答得到","en":"Can I get back to you on that? I need to check the figures.","a":["Let me confirm and come back to you.","I don't want to guess — give me until tomorrow."],"n":"⚠️ 香港辦公室常講 'I will revert to you'。'revert' 喺標準英式英文意思係「回復原狀」，唔係「回覆」。用 get back to you。"},{"m":"work","c":"Meetings 會議","zh":"澄清對方意思","en":"Just so I'm clear — are we saying A or B?","a":["Can I check my understanding?","Sorry, which of the two are we going with?"]},{"m":"work","c":"Meetings 會議","zh":"討論兜圈，想收窄","en":"Are we going round in circles here?","a":["Shall we park this and come back to it?","I think we've exhausted this one."]},{"m":"work","c":"Meetings 會議","zh":"確認決定","en":"So are we agreed on that?","a":["Can I take that as a decision?","Is everyone happy to go with option two?"]},{"m":"work","c":"Meetings 會議","zh":"分派跟進工作","en":"Who's taking that forward?","a":["Let's put a name against each item.｜更有系統","I'll pick that one up.｜自己認"]},{"m":"work","c":"Meetings 會議","zh":"問限期","en":"When do you need this by?","a":["What's the deadline on that?","Can we say end of next week?"]},{"m":"work","c":"Meetings 會議","zh":"結束會議","en":"I think that covers everything.","a":["Unless anyone has anything else, let's wrap up.","Any other business? No? Good — thank you all."]},{"m":"work","c":"Meetings 會議","zh":"會後跟進","en":"I'll circulate the notes this afternoon.","a":["I'll send round a summary with the action points.","You'll have the minutes by tomorrow."]},{"m":"work","c":"Requests 請求委派","zh":"客氣請人幫手","en":"Would you mind having a look at this?","a":["Could you do me a favour?｜較熟嘅同事","When you get a chance, could you check this over?｜唔急"],"n":"英文請求嘅禮貌程度靠句式，唔靠 'please'。'Would you mind…' 比 'Please do…' 客氣好多。"},{"m":"work","c":"Requests 請求委派","zh":"急事請求","en":"I'm sorry to rush you, but I need this by three.","a":["This one's urgent, I'm afraid.","I hate to push, but the deadline's today."]},{"m":"work","c":"Requests 請求委派","zh":"委派工作","en":"Can I hand this one to you?","a":["I'd like you to take the lead on this.｜更有信任感","Would you be able to own this?"]},{"m":"work","c":"Requests 請求委派","zh":"講清楚要求","en":"What I need from you is the quotation by Friday.","a":["Two things: the headcount and the venue.","Just to be specific — A first, then B."]},{"m":"work","c":"Requests 請求委派","zh":"第一次追進度","en":"Just checking in on the quotation.","a":["Any movement on the lift repair?","Where are we with the tender?"]},{"m":"work","c":"Requests 請求委派","zh":"第二次追，要硬啲","en":"I chased this last week — can you give me a date?","a":["I'll have to escalate this if I don't hear back today.｜最硬","This is now holding up the whole project."],"n":"英文職場升溫係循序漸進嘅。第一次軟、第二次點名時間、第三次先提 escalate。跳步會嚇親人。"},{"m":"work","c":"Requests 請求委派","zh":"拒絕（唔傷和氣）","en":"I'd like to help, but I haven't got the capacity this week.","a":["I'm afraid that's not something I can approve.｜職權上拒絕","Not this term, I'm afraid.｜最短"],"n":"'I'm afraid…' 係英式拒絕嘅標準緩衝。冇咗佢，同一句會聽落好硬。"},{"m":"work","c":"Requests 請求委派","zh":"有條件答應","en":"I can do that, but something else will have to give.","a":["Happy to — provided we push the deadline.","Yes, if you can take the ordering off me."]},{"m":"work","c":"Requests 請求委派","zh":"多謝人幫手","en":"Thanks for turning that around so quickly.","a":["I appreciate you sorting this out.","That's a big help — thank you."]},{"m":"work","c":"Vendors 供應商承辦商","zh":"索取報價","en":"Could you send me a quotation for this?","a":["Can you quote for the works described?｜更正式","I'll need it in writing, please."]},{"m":"work","c":"Vendors 供應商承辦商","zh":"問大概價錢","en":"What are we looking at, roughly?","a":["Can you give me a ballpark figure?","Rough order of cost?"]},{"m":"work","c":"Vendors 供應商承辦商","zh":"議價","en":"Is there any room on the price?","a":["That's higher than we budgeted for. Can you sharpen it?｜專業講法","What can you do if we commit for two years?｜換條件"],"n":"'Is there any room?' 係英文議價最自然嘅開場，比 'Can you cheaper?' 專業好多。"},{"m":"work","c":"Vendors 供應商承辦商","zh":"問交貨／到場時間","en":"What's the lead time on that?","a":["How soon can you get someone on site?","When could the works actually start?"]},{"m":"work","c":"Vendors 供應商承辦商","zh":"安排工程時間","en":"Can the works be done during the school holidays?","a":["We can't have drilling during lesson time.","It'll have to be after four, I'm afraid."]},{"m":"work","c":"Vendors 供應商承辦商","zh":"投訴工程質素","en":"I'm not happy with the standard of work.","a":["This isn't what we agreed.","We'll need this put right before we sign off.｜最有力"]},{"m":"work","c":"Vendors 供應商承辦商","zh":"指出缺失要求返工","en":"There are a few defects I need you to come back and fix.","a":["The job isn't finished to my satisfaction.","I've listed the snagging items — see the attachment."],"n":"'snagging' = 工程完工後嘅執漏清單，係建築業標準用語。用得出即刻專業。"},{"m":"work","c":"Vendors 供應商承辦商","zh":"未執好唔會簽收","en":"I can't sign this off until the snagging is done.","a":["Payment follows completion, not the other way round.","We'll release it once I've inspected."]},{"m":"work","c":"Vendors 供應商承辦商","zh":"講合約範圍","en":"That's outside the scope of the contract.","a":["That falls under the warranty — there shouldn't be a charge.","That's a variation, so I'll need it costed separately."]},{"m":"work","c":"Vendors 供應商承辦商","zh":"好聲好氣收尾","en":"Thanks — send me the invoice and I'll process it.","a":["That's all in order. I'll get payment moving.","Good job. I'll be in touch about the next one."]},{"m":"work","c":"Facilities 設施維修","zh":"報告故障","en":"The air conditioning in Room 302 has packed up.","a":["We've got a leak in the staff room ceiling.","The lift is playing up again.｜間歇性故障"],"n":"'packed up' = 完全壞咗（英式口語）；'playing up' = 時好時壞。兩個都好地道。"},{"m":"work","c":"Facilities 設施維修","zh":"講緊急程度（唔急）","en":"It's not urgent, but it needs doing before term starts.","a":["No rush — just get it on the list.","Whenever you're next on site."]},{"m":"work","c":"Facilities 設施維修","zh":"講緊急程度（好急）","en":"This one can't wait — it's a safety issue.","a":["I need someone today, I'm afraid.","This is a hazard. It has to be dealt with now."]},{"m":"work","c":"Facilities 設施維修","zh":"要求人來睇","en":"Can you come and take a look?","a":["I'd like someone to inspect it this week.","Could you send an engineer out?"]},{"m":"work","c":"Facilities 設施維修","zh":"描述問題歷史","en":"It's been intermittent for a couple of weeks, and it's getting worse.","a":["It started after the typhoon.","It only happens when it rains heavily."]},{"m":"work","c":"Facilities 設施維修","zh":"臨時封閉","en":"We've cordoned it off for now.","a":["I've put it out of use until it's fixed.","It's taped off and signed."]},{"m":"work","c":"Facilities 設施維修","zh":"通知全校","en":"The lift will be out of service on Thursday.","a":["Apologies in advance for the noise — works are scheduled this week.","Please avoid the east staircase until further notice."]},{"m":"work","c":"Budget 財政採購","zh":"喺預算內","en":"That's within budget.","a":["We can absorb that.","No problem on the money side."]},{"m":"work","c":"Budget 財政採購","zh":"冇預算","en":"We haven't got the budget for that this year.","a":["That would take us over.","It's not in this year's allocation, I'm afraid."]},{"m":"work","c":"Budget 財政採購","zh":"申請額外撥款","en":"I'll need to put in a request for additional funding.","a":["I'll have to take this to the Principal for approval.","We'd need a supplementary allocation."]},{"m":"work","c":"Budget 財政採購","zh":"比較報價","en":"We've got three quotations — this one's the most competitive.","a":["Cheapest isn't always best value. Here's my recommendation.｜更專業","On balance I'd go with the second one."],"n":"'most competitive' 比 'cheapest' 專業；'best value' 更加係採購行內講法。"},{"m":"work","c":"Budget 財政採購","zh":"講採購程序","en":"Anything over fifty thousand has to go to tender.","a":["I'll need two more quotes before we can proceed.","Procurement rules mean I can't just award it."]},{"m":"work","c":"Budget 財政採購","zh":"催發票","en":"Could you send the invoice through so I can process the payment?","a":["I need the invoice before I can release funds.","Once I've got the paperwork, payment takes about a fortnight."]},{"m":"work","c":"Principal 上司同事","zh":"簡短匯報","en":"Quick update on the roof works.","a":["Two minutes on the canteen contract, if you've got them.","Nothing urgent — just keeping you in the loop."]},{"m":"work","c":"Principal 上司同事","zh":"預警問題","en":"I wanted to flag something before it becomes a problem.","a":["There's an issue I need to raise with you.","Heads up — this could get awkward."],"n":"'flag something' 同 'heads up' 係職場預警嘅標準講法。早講永遠好過遲講。"},{"m":"work","c":"Principal 上司同事","zh":"提出建議","en":"My suggestion would be to hold off until August.","a":["If it were up to me, I'd go with option two.","Can I recommend a different approach?"]},{"m":"work","c":"Principal 上司同事","zh":"表達保留","en":"I've got some reservations about the timing.","a":["My concern is that we're leaving it too late.","I'm not comfortable with the risk here."]},{"m":"work","c":"Principal 上司同事","zh":"請示授權","en":"Are you happy for me to go ahead?","a":["I'd rather check with you before I commit us.","Do I have your approval to sign?"]},{"m":"work","c":"Principal 上司同事","zh":"有禮咁頂返上司","en":"I hear you, but I don't think that's realistic in the time we've got.","a":["Can I be honest about the practicalities?","I'll do it if you want — but I should tell you the risk first.｜最安全嘅頂法"],"n":"最後嗰句係黃金句：唔係拒絕，係「我服從，但我盡咗告知責任」。上司多數會自己改變主意。"},{"m":"work","c":"Principal 上司同事","zh":"承擔責任","en":"That one's on me. I'll sort it.","a":["My mistake — I'll put it right.","I should have caught that. Leave it with me."]},{"m":"work","c":"Principal 上司同事","zh":"應承同事","en":"Leave it with me.","a":["I'll take care of it.","Consider it done.｜最有信心"]},{"m":"work","c":"Bad news 壞消息道歉","zh":"預告壞消息","en":"I'm afraid I've got some bad news about the hall booking.","a":["This isn't what you want to hear, but…","There's been a setback — let me explain."]},{"m":"work","c":"Bad news 壞消息道歉","zh":"道歉","en":"I'm sorry — that was my oversight.","a":["Apologies, that slipped through.","That shouldn't have happened, and it was my fault."]},{"m":"work","c":"Bad news 壞消息道歉","zh":"提出補救","en":"Here's what I propose we do about it.","a":["I can't undo it, but I can do this.","Give me a day and I'll have an alternative."],"n":"英文職場文化：道歉之後一定要即刻跟一個方案。只道歉唔提方案會被視為冇擔當。"},{"m":"work","c":"Bad news 壞消息道歉","zh":"通知延誤","en":"It's going to be later than I said. Here's why.","a":["We've slipped by about a week.","I need to revise the timeline — let me talk you through it."]},{"m":"work","c":"Events 活動統籌","zh":"問人數","en":"How many are we expecting?","a":["Can you give me a headcount by Wednesday?","Rough numbers will do for now."]},{"m":"work","c":"Events 活動統籌","zh":"分工","en":"I'll sort the venue and the catering.","a":["I'll handle logistics — you take the programme.","Leave the room booking and AV to me."]},{"m":"work","c":"Events 活動統籌","zh":"問後備方案（香港必問）","en":"What's the wet weather plan?","a":["What happens if there's a typhoon signal?","Do we have a fallback if it's cancelled?"]},{"m":"work","c":"Events 活動統籌","zh":"綵排","en":"I'll do a run-through with the team on Friday.","a":["Let's walk the site together beforehand.","Full rehearsal Thursday afternoon."]},{"m":"work","c":"Safety 安全事故","zh":"報告事故","en":"Nobody was hurt, but I've filed a report.","a":["Minor incident this morning — everyone's fine.","No injuries, but it was close."]},{"m":"work","c":"Safety 安全事故","zh":"已採取措施","en":"I've made the area safe.","a":["It's isolated and signed off.","Access is restricted until it's inspected."]},{"m":"work","c":"Safety 安全事故","zh":"要正式記錄","en":"We need to log this as an incident.","a":["This goes in the accident book.","I'll write it up formally."]},{"m":"work","c":"Safety 安全事故","zh":"要求風險評估","en":"Can we do a risk assessment before we commit?","a":["I'd want that checked by a professional first.","Not until someone qualified has signed it off."]},{"m":"chat","c":"Openers 開場","zh":"早上見到同事","en":"Morning! How's things?","a":["Morning — how are you doing?｜最中性","Alright?｜英式，好隨和，唔係真係問你點"],"n":"⚠️ 'How are you?' / 'Alright?' 唔係真問題。標準答法係 'Good, thanks — you?' 然後就完。答足三分鐘身體狀況係典型嘅文化誤會。"},{"m":"chat","c":"Openers 開場","zh":"覺得對方好忙","en":"Busy week?","a":["You look like you've got a lot on.","Rushed off your feet?｜英式生動"]},{"m":"chat","c":"Openers 開場","zh":"星期一","en":"How was your weekend?","a":["Good weekend?","Did you get up to anything?"]},{"m":"chat","c":"Openers 開場","zh":"對方放完假返嚟","en":"Have you been away?","a":["Welcome back — good break?","How was the holiday?"]},{"m":"chat","c":"Openers 開場","zh":"見到對方好早返","en":"You're in early.","a":["Beat me in today!","Early start?"]},{"m":"chat","c":"Openers 開場","zh":"下午見到，對方好攰","en":"Long day?","a":["Nearly there.","Not long to go now."]},{"m":"chat","c":"Weather 天氣（香港）","zh":"好熱","en":"It's absolutely boiling out there.","a":["Have you seen the humidity today?","You step outside and you're wet through."],"n":"英國人真係成日講天氣，而香港天氣夠戲劇性 —— 呢個係同外籍同事最安全嘅開場話題。"},{"m":"chat","c":"Weather 天氣（香港）","zh":"打風","en":"Looks like the typhoon's coming in on Thursday.","a":["T8 tomorrow, by the looks of it.","Are they going to hoist the signal, do you think?"]},{"m":"chat","c":"Weather 天氣（香港）","zh":"轉涼","en":"First proper cool day, isn't it?","a":["Finally, some fresh air.","You can almost wear a jacket."]},{"m":"chat","c":"Weather 天氣（香港）","zh":"落大雨淋濕","en":"I got absolutely soaked coming in.","a":["The umbrella was useless.","It came down out of nowhere."]},{"m":"chat","c":"Commute 交通","zh":"問返工路程","en":"Was the MTR bad this morning?","a":["How long does it take you to get in?","Where do you come in from?"]},{"m":"chat","c":"Commute 交通","zh":"塞車","en":"The traffic was a nightmare.","a":["Took me twice as long as usual.","Something must have happened on the tunnel."]},{"m":"chat","c":"Food 食","zh":"問人食咩午餐","en":"Where are you going for lunch?","a":["Any good places round here?","Shall we grab something?"],"n":"⚠️ 「食咗飯未？」直譯 'Have you eaten?' 喺英文係真問題，對方會以為你想約佢食飯。想打招呼就用 'How's things?'。"},{"m":"chat","c":"Food 食","zh":"推介餐廳","en":"I can recommend the place on the corner.","a":["There's a decent noodle shop two streets down.","Worth trying if you haven't."]},{"m":"chat","c":"Food 食","zh":"約食飯","en":"Shall we grab lunch sometime this week?","a":["Fancy joining us?","We usually go down at half twelve — you're welcome to come."]},{"m":"chat","c":"Weekend 假期","zh":"問週末計劃","en":"Any plans for the weekend?","a":["Doing anything nice?","Got much on?"]},{"m":"chat","c":"Weekend 假期","zh":"問長假","en":"Doing anything over Easter?","a":["Did you get away at all in the summer?","Going anywhere for Chinese New Year?"]},{"m":"chat","c":"Weekend 假期","zh":"對方去完旅行","en":"How was Japan?","a":["Was it as good as everyone says?","Would you go back?"]},{"m":"chat","c":"Keeping it going 接話","zh":"想對方講多啲（最重要）","en":"Oh really? How come?","a":["That sounds like hard work.","And how did that go?"],"n":"閒聊嘅重點唔係你識講幾多，係你識唔識<b>接<\/b>。呢三句可以令對方講多兩分鐘，而你唔使諗新話題。"},{"m":"chat","c":"Keeping it going 接話","zh":"表示同感","en":"Same here, actually.","a":["I know exactly what you mean.","You and me both."]},{"m":"chat","c":"Keeping it going 接話","zh":"想追問細節","en":"Tell me more.","a":["Go on…","What happened in the end?"]},{"m":"chat","c":"Keeping it going 接話","zh":"承認對方講得好","en":"That's a good point, actually.","a":["I hadn't thought of it like that.","Fair enough."]},{"m":"chat","c":"Reacting 反應","zh":"驚訝","en":"No way!","a":["You're joking.","Seriously?"]},{"m":"chat","c":"Reacting 反應","zh":"為對方開心","en":"That's brilliant.","a":["Good for you!","That's great news."]},{"m":"chat","c":"Reacting 反應","zh":"同情","en":"Oh dear. That's a shame.","a":["That's rotten luck.","What a pain."]},{"m":"chat","c":"Reacting 反應","zh":"開玩笑話唔想同對方換位","en":"Rather you than me!","a":["Better you than me.","I don't envy you."],"n":"英式幽默，帶親切感。用喺同事講佢要做啲麻煩嘢嘅時候。"},{"m":"chat","c":"Compliments 讚賞","zh":"讚同事表現","en":"That was a great assembly.","a":["You handled that really well.","I don't know how you kept them that quiet."]},{"m":"chat","c":"Compliments 讚賞","zh":"讚外表（安全版）","en":"That's a lovely jacket — where's it from?","a":["You look well.","New glasses? They suit you."],"n":"職場讚外表要小心。安全嘅係讚<b>物件<\/b>（衫、袋、眼鏡）唔係讚<b>身體<\/b>。"},{"m":"chat","c":"Sympathy 關心","zh":"聽到壞消息","en":"I'm sorry to hear that.","a":["That must be tough.","I hope things settle down soon."]},{"m":"chat","c":"Sympathy 關心","zh":"對方病咗","en":"Hope you feel better soon.","a":["Get some rest.","Don't rush back."]},{"m":"chat","c":"Sympathy 關心","zh":"想幫手","en":"Is there anything I can do?","a":["Shout if you need cover.","Let me know if you want anything taken off your plate."]},{"m":"chat","c":"Exiting 收尾（好重要）","zh":"想結束對話但唔失禮","en":"Anyway, I'd better let you get on.","a":["Right, I'll leave you to it.","I'd better crack on.｜英式，講自己要做嘢"],"n":"好多人識開場唔識收尾，結果對話拖到尷尬。呢三句係英文閒聊嘅標準出口，用完就可以自然行開。"},{"m":"chat","c":"Exiting 收尾（好重要）","zh":"友善道別","en":"Good to see you — catch you later.","a":["See you around.","Have a good one."]},{"m":"chat","c":"Exiting 收尾（好重要）","zh":"想真係約下次","en":"Let's grab a coffee properly sometime.","a":["We should catch up properly.","Come and find me when you're free."]},{"m":"chat","c":"Foreign colleagues 外籍同事","zh":"問佢住得慣唔慣","en":"How are you finding Hong Kong?","a":["Have you settled in alright?","Is it what you expected?"]},{"m":"chat","c":"Foreign colleagues 外籍同事","zh":"問來咗幾耐","en":"How long have you been out here?","a":["Is this your first year at the school?","What brought you over?"]},{"m":"chat","c":"Foreign colleagues 外籍同事","zh":"問返唔返鄉下","en":"Do you get back home much?","a":["Will you be going back over the summer?","Is your family out here with you?"]},{"m":"chat","c":"Foreign colleagues 外籍同事","zh":"介紹本地嘢","en":"If you ever want to try proper local food, let me know.","a":["There's a hike near me you'd probably like.","Have you been out to the islands yet?"]},{"m":"chat","c":"Parents 家長","zh":"歡迎家長","en":"Thanks for coming in.","a":["It's good to put a face to the name.","I appreciate you making the time."]},{"m":"chat","c":"Parents 家長","zh":"先安撫（唔係壞消息）","en":"Nothing to worry about — I just wanted a quick word.","a":["This is a positive conversation, I promise.","No problems at all. Quite the opposite."]},{"m":"chat","c":"Parents 家長","zh":"讚學生","en":"He's a pleasure to teach.","a":["She contributes a lot in class.","He's well liked, and he works hard."]},{"m":"chat","c":"Parents 家長","zh":"結束會面","en":"Do get in touch if anything comes up.","a":["My door's open — just email me.","Thanks again for coming."]}],"FIX":[{"b":"Because the price is high, so people buy less.","g":"Because the price is high, people buy less.","w":"because 同 so 只可以用一個。中文「因為…所以…」係雙的，英文唔係。"},{"b":"Although it is expensive, but people still buy it.","g":"Although it is expensive, people still buy it.","w":"although 同 but 二揀一。呢個係香港學生 script 上最常見嘅扣分位。"},{"b":"We will discuss about this topic.","g":"We'll discuss this topic.","w":"discuss 後面唔跟 about。"},{"b":"I want to emphasise on this point.","g":"I want to emphasise this point.","w":"emphasise 後面唔跟 on。"},{"b":"There have many reasons.","g":"There are many reasons.","w":"中文「有」直譯成 have。英文存在句一律 there is / there are。"},{"b":"Do you have any question?","g":"Any questions?","w":"questions 要複數。而且簡短版更自然。"},{"b":"This one is more better.","g":"This one is much better.","w":"better 已經係比較級，唔可以再加 more。要加強用 much / far。"},{"b":"Open the light. / Open the projector.","g":"Turn on the lights. / Switch on the projector.","w":"電器用 turn on / switch on，唔用 open。"},{"b":"He is lack of confidence.","g":"He lacks confidence. / He has a lack of confidence.","w":"lack 做動詞唔使 be + of；做名詞先用 a lack of。"},{"b":"In nowadays, students are different.","g":"These days, students are different.","w":"nowadays 本身已經係副詞，前面唔加 in。"},{"b":"This is depend on the situation.","g":"This depends on the situation.","w":"depend 係動詞，唔使 is。"},{"b":"We can divide into two parts.","g":"We can divide it into two parts.","w":"divide 需要受詞。"},{"b":"Understand?","g":"Does that make sense?","w":"Understand? 聽落似查問。Does that make sense? 把責任放喺解釋上，唔係放喺學生身上。"},{"b":"Today I will teach you chapter five.","g":"Today we're going to look at chapter five.","w":"'I will teach you' 語氣單向。'we're going to look at' 把學生放埋一齊，係國際課堂嘅預設講法。"},{"b":"Very much people made this mistake.","g":"A lot of people made this mistake.","w":"people 可數，用 many / a lot of，唔用 very much。"},{"b":"It affects to the result.","g":"It affects the result.","w":"affect 係及物動詞，後面唔加 to。"},{"b":"This will effect your grade.","g":"This will affect your grade.","w":"affect = 動詞（影響）；effect = 名詞（效果）。"},{"b":"The price will raise.","g":"The price will rise. / They will raise the price.","w":"rise 不及物（自己升）；raise 及物（有人抬高佢）。"},{"b":"According to the graph, we can see that it increase.","g":"The graph shows that it increases.","w":"'According to… we can see' 三重累贅，加漏第三人稱單數 -s。"},{"b":"I very like this example.","g":"I really like this example.","w":"very 唔可以直接修飾動詞。用 really，或 very much 放句尾。"},{"b":"He didn't came yesterday.","g":"He didn't come yesterday.","w":"did 已經標示咗過去式，後面用原形。"},{"b":"I have finished it yesterday.","g":"I finished it yesterday.","w":"有明確過去時間（yesterday）就唔可以用 present perfect。"},{"b":"Someone can answer?","g":"Can anyone answer? / Anyone?","w":"疑問句要倒裝，而且 someone 應改 anyone。"},{"b":"You all understand or not?","g":"Is everyone with me?","w":"'…or not?' 係直譯「…定唔係？」，英文聽落好對抗性。"},{"b":"That's mean the answer is B.","g":"That means the answer is B.","w":"That's = that is，後面唔可以再接動詞原形。"},{"b":"Please explain me this question.","g":"Please explain this question to me.","w":"explain 唔可以直接跟人：explain something TO somebody。"},{"b":"Let me to explain.","g":"Let me explain.","w":"let + 人 + 原形動詞，中間唔加 to。"},{"b":"The reason is because he was absent.","g":"The reason is that he was absent.","w":"reason 同 because 意思重複。"},{"b":"I am agree with you.","g":"I agree with you.","w":"agree 本身係動詞，唔使 am。"},{"b":"He is very hardworking student.","g":"He is a very hardworking student.","w":"單數可數名詞前面一定要有冠詞。香港最高頻嘅語法漏洞。"},{"b":"Two years ago I have taught this.","g":"Two years ago I taught this.","w":"明確過去時間 + present perfect 唔夾。"},{"b":"Can you repeat again?","g":"Could you say that again?","w":"repeat 已經包含「再」，加 again 累贅。"},{"b":"Sit down please, don't make noise.","g":"Sit down, please — and keep the noise down.","w":"'make noise' 唔自然。用 keep the noise down / quieten down。"},{"b":"I hope everyone can pay attention.","g":"I need everyone's attention, please.","w":"'I hope you can…' 語氣太弱，學生唔會當係指令。指令要直接但有禮。"},{"b":"Until now, we have learned three chapters.","g":"So far, we've covered three chapters.","w":"'until now' 暗示「而家開始唔同」。「到目前為止」要用 so far。"},{"b":"I will revert to you tomorrow.","g":"I'll get back to you tomorrow.","w":"⚠️ 香港辦公室常見。'revert' 標準英文意思係「回復原狀」，唔係「回覆」。Native 聽落會一頭霧水。"},{"b":"Please be informed that the lift is out of service.","g":"Just to let you know, the lift is out of service.","w":"'Please be informed' 過度官腔，係中式公文直譯。除非係正式通告，否則用自然語氣。"},{"b":"Kindly advise the status of the quotation.","g":"Could you let me know where the quotation stands?","w":"'Kindly + 動詞' 係東南亞商業英語特色，native 用得極少，而且聽落有命令感。"},{"b":"Please do the needful.","g":"Could you take care of it?","w":"'do the needful' 係印度／東南亞英語，英式美式都唔用。"},{"b":"Attached herewith please find the invoice.","g":"I've attached the invoice.","w":"herewith 除法律文件外唔用。整句改成主動、簡短。"},{"b":"How to say this in English?","g":"How do you say this in English? / What's the word for this?","w":"疑問句需要主語同助動詞。"},{"b":"I will do it later.","g":"I'll do it this afternoon. / I'll have it to you by four.","w":"'later' 喺英文可以指一個鐘後，都可以指永遠。職場上要講具體時間，否則對方會焦慮。"}],"NAT":[{"g":"1. 縮略式 Contractions — 唔縮 = 即刻似讀稿","b":"I will send it to you.","n2":"I'll send it over."},{"g":"1. 縮略式 Contractions — 唔縮 = 即刻似讀稿","b":"That is not what we agreed.","n2":"That's not what we agreed."},{"g":"1. 縮略式 Contractions — 唔縮 = 即刻似讀稿","b":"I am not sure.","n2":"I'm not sure."},{"g":"1. 縮略式 Contractions — 唔縮 = 即刻似讀稿","b":"We are going to look at chapter five.","n2":"We're going to look at chapter five."},{"g":"1. 縮略式 Contractions — 唔縮 = 即刻似讀稿","b":"Let us begin.","n2":"Let's start."},{"g":"1. 縮略式 Contractions — 唔縮 = 即刻似讀稿","b":"It is going to be late.","n2":"It's going to be late."},{"g":"1. 縮略式 Contractions — 唔縮 = 即刻似讀稿","b":"I would like you to try question four.","n2":"I'd like you to try question four."},{"g":"1. 縮略式 Contractions — 唔縮 = 即刻似讀稿","b":"Do not worry about that.","n2":"Don't worry about that."},{"g":"1. 縮略式 Contractions — 唔縮 = 即刻似讀稿","b":"There is a problem with the booking.","n2":"There's a problem with the booking."},{"g":"1. 縮略式 Contractions — 唔縮 = 即刻似讀稿","b":"I have not marked them yet.","n2":"I haven't marked them yet."},{"g":"1. 縮略式 Contractions — 唔縮 = 即刻似讀稿","b":"What is the answer?","n2":"What's the answer?","n":"⚠️ 講嘢唔縮寫，聽落就似讀稿。呢個係「似背書」最單一嘅原因。但注意：gonna / wanna / gotta 只可以講，唔可以寫。"},{"g":"2. 講短句 Fragments — 完整句係書面感","b":"Are there any questions?","n2":"Any questions?"},{"g":"2. 講短句 Fragments — 完整句係書面感","b":"That is a good question.","n2":"Good question."},{"g":"2. 講短句 Fragments — 完整句係書面感","b":"Is that c
